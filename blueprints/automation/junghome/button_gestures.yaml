blueprint:
  name: JUNG HOME button — click / hold
  description: >
    Run one action when a JUNG HOME button is clicked and another when it is
    held.

    The integration classifies every press for you: a press released within
    1 second fires a `click` event, a press still down after 1 second fires
    `hold_start` (and `hold_end` at the release). This blueprint simply maps
    those two events to actions — there is no timing to tune, and nothing
    waits: a click acts the moment the button is released.

    Pick the `event.*` entity (or entities) for one physical button and fill in
    the actions you want — leave one empty to ignore that gesture.

    Double-click is NOT available on current JUNG device firmware (2.2.0.x):
    it reports every tap twice, and a single click is indistinguishable from
    a double click over the gateway's API. The double-click inputs below are
    kept only for older device firmware that reports each tap once — see
    "Detect double-clicks (old firmware only)".
  domain: automation
  author: junghome
  source_url: https://github.com/ernetas/junghome/blob/main/blueprints/automation/junghome/button_gestures.yaml
  input:
    button:
      name: Button (event entities)
      description: >
        The JUNG HOME event entity (or entities) for one physical button side —
        a rocker exposes one entity per side (`..._up` / `..._down`); select the
        side(s) this automation should react to. Find them under Developer
        Tools → States, filtered by `event.`; the `event_type` attribute shows
        `click`, `hold_start` and `hold_end` (as well as the raw `pressed` /
        `depressed` edges) when you press.
      selector:
        entity:
          multiple: true
          filter:
            - domain: event
              integration: junghome
    single_action:
      name: Click action
      description: >
        Runs on a click — a press released within 1 second. Leave empty to
        ignore.
      default: []
      selector:
        action: {}
    hold_action:
      name: Hold action
      description: >
        Runs once the button has been held for 1 second (the integration's
        `hold_start` event), while it is still down. Leave empty to ignore.
      default: []
      selector:
        action: {}
    legacy_double_click:
      name: Detect double-clicks (old firmware only)
      description: >
        Off by default, and leave it off on current device firmware: one tap
        already arrives as two press/release pairs there, so a double-click
        cannot be told from a single one. Turn it on only if your buttons
        report each tap ONCE (device firmware before 2.2.0) — and then also
        turn off "Ignore duplicate button presses" in the integration's
        options, or the second click is dropped before this blueprint sees it.
        When on, every click waits for the double-click window before the
        click action runs.
      default: false
      selector:
        boolean: {}
    double_click_window:
      name: Double-click window (old firmware only)
      description: >
        Used only with "Detect double-clicks": after a click, how long to wait
        for a second click before running the click action. Larger values
        catch slower double-clicks but make a single click feel laggier.
      default: 400
      selector:
        number:
          min: 100
          max: 1500
          step: 50
          unit_of_measurement: milliseconds
          mode: box
    double_action:
      name: Double-click action (old firmware only)
      description: >
        Runs when a second click arrives within the double-click window.
        Only used with "Detect double-clicks". Leave empty to ignore.
      default: []
      selector:
        action: {}

# `single` matters for the legacy double-click path: the second click must be
# caught by its wait_for_trigger, not start a run of its own. Elsewhere every
# gesture is a separate run; a gesture arriving while an action is still
# running is dropped silently, as before.
mode: single
max_exceeded: silent

# Trigger on ANY change of the selected event entities, then keep only the
# gestures. We deliberately do NOT use `attribute: event_type` / `to: click`:
# an event entity's state is a timestamp, so a `to:`-style trigger silently
# misses a repeated `click` (two clicks in a row keep the attribute at
# "click").
triggers:
  - trigger: state
    entity_id: !input button

conditions:
  # A gesture, and a *real* one. An event entity restores its last state
  # across a restart, an entry reload and a failed poll, so the `unavailable
  # -> <restored timestamp>` transition re-presents the stored `event_type`
  # and looked exactly like a fresh gesture here — firing the user's lights on
  # its own. Requiring a real previous state costs nothing: the first genuine
  # gesture after a recovery still transitions timestamp -> timestamp and
  # fires normally. The raw `pressed` / `depressed` edges and `hold_end` are
  # not gestures this blueprint acts on.
  - condition: template
    value_template: >
      {{ trigger is defined and trigger.to_state is not none
         and trigger.from_state is not none
         and trigger.from_state.state not in ('unavailable', 'unknown')
         and trigger.to_state.attributes.get('event_type') in ('click', 'hold_start') }}

actions:
  - variables:
      gesture: "{{ trigger.to_state.attributes.get('event_type') }}"
      legacy_double_click: !input legacy_double_click

  - choose:
      # ---- HOLD: the integration's timer said the press is a hold ----
      - conditions:
          - "{{ gesture == 'hold_start' }}"
        sequence:
          - choose: []
            default: !input hold_action

      # ---- LEGACY DOUBLE-CLICK (old firmware only): wait for a 2nd click ----
      - conditions:
          - "{{ gesture == 'click' and legacy_double_click }}"
        sequence:
          - wait_for_trigger:
              - trigger: state
                entity_id: !input button
            timeout:
              milliseconds: !input double_click_window
            continue_on_timeout: true
          - choose:
              # A second real click inside the window -> DOUBLE (same
              # real-previous-state guard, so a recovery inside the window
              # cannot fake it).
              - conditions:
                  - >
                    {{ wait.trigger is not none
                       and wait.trigger.to_state is not none
                       and wait.trigger.from_state is not none
                       and wait.trigger.from_state.state not in ('unavailable', 'unknown')
                       and wait.trigger.to_state.attributes.get('event_type') == 'click' }}
                sequence:
                  - choose: []
                    default: !input double_action
            # Nothing (or something else) in the window -> CLICK
            default:
              - choose: []
                default: !input single_action

    # ---- CLICK: act now ----
    default:
      - choose: []
        default: !input single_action
