blueprint:
  name: JUNG HOME button — single / double / hold
  description: >
    Turn one JUNG HOME rocker button into single-click, double-click and hold
    gestures.

    JUNG rockers only report raw `pressed` / `depressed` (release) events, so
    this blueprint measures the timing between them: a press that is not released
    within the hold time is a *hold*; a press, release and second press within
    the double-click window is a *double*; anything else is a *single*.

    Pick the `event.*` entity (or entities) for one physical button and fill in
    the actions you want for each gesture — leave a gesture empty to ignore it.
    JUNG sometimes exposes a button as separate `up_request` and `down_request`
    events. On some firmware, pressing the button echoes a spurious edge onto
    the sibling channel, which this blueprint would misread as a second click —
    if that's your gateway, select **only** the one channel that reliably
    reports every gesture (check with a debug logger first; see
    docs/example-button-automation.md in the repo). Only select both if your
    button genuinely alternates channels per press with no echoes.
  domain: automation
  author: junghome
  source_url: https://github.com/ernetas/junghome/blob/main/blueprints/automation/junghome/button_gestures.yaml
  input:
    button:
      name: Button (event entities)
      description: >
        The JUNG HOME event entity (or entities) for one physical button. JUNG
        sometimes splits a single button into `up_request` and `down_request`
        events. Some firmware echoes a spurious edge onto the sibling channel on
        every press, which reads as a false second click here — if that's your
        gateway, select only the one channel that reports every gesture
        completely. Select both only if your button alternates channels per
        press with no echoes. Find them under Developer Tools → States, filtered
        by `event.`; the `event_type` attribute flips between `pressed` and
        `depressed` when you press.
      selector:
        entity:
          multiple: true
          filter:
            - domain: event
              integration: junghome
    hold_time:
      name: Hold time
      description: How long the button must be held (without releasing) to count as a hold.
      default: 2
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: box
    double_click_window:
      name: Double-click window
      description: >
        After a release, how long to wait for a second press before deciding it
        was a single click. Larger values catch slower double-clicks but make a
        single click feel laggier.
      default: 400
      selector:
        number:
          min: 100
          max: 1500
          step: 50
          unit_of_measurement: milliseconds
          mode: box
    single_action:
      name: Single-click action
      description: Runs on a single press-and-release. Leave empty to ignore.
      default: []
      selector:
        action: {}
    double_action:
      name: Double-click action
      description: Runs when the button is pressed twice within the double-click window. Leave empty to ignore.
      default: []
      selector:
        action: {}
    hold_action:
      name: Hold action
      description: Runs once the button has been held for the hold time. Leave empty to ignore.
      default: []
      selector:
        action: {}

# Ignore re-triggers while we are still measuring a gesture; the second press of
# a double-click is caught by wait_for_trigger below, not by re-triggering.
mode: single
max_exceeded: silent

# Trigger on ANY change of the selected event entities, then keep only press
# edges. We deliberately do NOT use `attribute: event_type` / `to: pressed`:
# an event entity's state is a timestamp, so a `to:`-style trigger silently
# misses repeated `pressed` event_types (e.g. JUNG alternating up/down), which
# is what made double-clicks register as singles.
triggers:
  - trigger: state
    entity_id: !input button

conditions:
  # A press, and a *real* one. An event entity restores its last state across a
  # restart, an entry reload and a failed poll, so the `unavailable -> <restored
  # timestamp>` transition re-presents the stored `event_type` and looked exactly
  # like a fresh press here — firing a gesture, and the user's lights, on its own.
  # A button whose last recorded edge was `pressed` (which is what happens when
  # the socket drops between press and release) did it on *every* recovery.
  # Requiring a real previous state costs nothing: the first genuine press after
  # a recovery still transitions timestamp -> timestamp and fires normally.
  - condition: template
    value_template: >
      {{ trigger is defined and trigger.to_state is not none
         and trigger.from_state is not none
         and trigger.from_state.state not in ('unavailable', 'unknown')
         and trigger.to_state.attributes.get('event_type') == 'pressed' }}

actions:
  # First press seen. Wait up to the hold time for the NEXT event of any kind.
  # JUNG alternates a button between its up/down events and can report the second
  # press *before* the first release, so we react to whatever comes next rather
  # than assuming a release:
  #   - nothing within hold_time  → still held              → HOLD
  #   - another 'pressed'         → a second click          → DOUBLE
  #   - a 'depressed' (release)   → maybe single / slow double → check below
  - wait_for_trigger:
      - trigger: state
        entity_id: !input button
    timeout:
      seconds: !input hold_time
    continue_on_timeout: true
  - variables:
      # Same guard as the trigger condition: a recovery landing inside the hold
      # window must not be mistaken for the second press of a double-click.
      evt: >-
        {{ wait.trigger.to_state.attributes.get('event_type')
           if (wait.trigger is not none and wait.trigger.to_state is not none
               and wait.trigger.from_state is not none
               and wait.trigger.from_state.state not in ('unavailable', 'unknown'))
           else none }}

  - choose:
      # ---- HOLD: nothing happened within the hold time → still held ----
      - conditions:
          - "{{ wait.trigger is none }}"
        sequence:
          - choose: []
            default: !input hold_action

      # ---- DOUBLE: a second press arrived before the first released ----
      - conditions:
          - "{{ evt == 'pressed' }}"
        sequence:
          - choose: []
            default: !input double_action

    # ---- The first press was released: SINGLE, or a slower double ----
    default:
      # Wait once more for a second press within the double-click window. This
      # catches double-clicks where the first release lands before the second
      # press.
      - wait_for_trigger:
          - trigger: state
            entity_id: !input button
        timeout:
          milliseconds: !input double_click_window
        continue_on_timeout: true
      - choose:
          - conditions:
              - >
                {{ wait.trigger is not none
                   and wait.trigger.to_state is not none
                   and wait.trigger.from_state is not none
                   and wait.trigger.from_state.state not in ('unavailable', 'unknown')
                   and wait.trigger.to_state.attributes.get('event_type') == 'pressed' }}
            sequence:
              - choose: []
                default: !input double_action
        # No second press in the window → SINGLE
        default:
          - choose: []
            default: !input single_action
