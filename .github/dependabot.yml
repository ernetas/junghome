# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # pip is deliberately NOT listed: Renovate owns it (renovate.json). The
  # pytest-homeassistant-custom-component stack must move as one group and is
  # version-capped there; a Dependabot PR bumping pytest/phacc/syrupy alone
  # bypassed both rules and produced unresolvable-conflict PRs.