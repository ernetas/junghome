name: Release

# Cut a GitHub release when a vX.Y.Z tag is pushed. HACS installs the latest
# release, so each tag becomes an installable version.
#
#   1. bump "version" in custom_components/junghome/manifest.json
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# This workflow fails if the tag doesn't match the manifest version, to keep
# them in sync, and it re-runs lint, tests and hassfest/HACS validation against
# the tagged commit before publishing anything. `test.yml` and friends only
# trigger on branch pushes and pull requests, so a tag ran *none* of them: a tag
# pushed alongside its commit could publish to every HACS user before CI on main
# had finished, or even after it had failed.
#
# A plain X.Y.Z tag is a normal release. Anything with a suffix (e.g. 1.1.0b1,
# 1.1.0-rc1) is published as a GitHub *pre-release*, which HACS hides from users
# unless they enable "show beta versions" for the repository — so betas don't
# auto-update everyone.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # Gate: the same checks main runs, but against the tag. Called workflows run at
  # the caller's ref, so these validate exactly what is about to be published.
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: [lint, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c "import json;print(json.load(open('custom_components/junghome/manifest.json'))['version'])")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag ($tag) does not match manifest version ($manifest)."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if printf '%s' "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            echo "Pre-release version ($tag): marking as pre-release so HACS won't auto-update everyone."
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease --latest=false
          fi
