rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done  # README "Removing the integration"
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: >-
      Every device-backed entity sets it. The scene platform is the one
      exception: scenes have no backing device to carry the label, so
      JungHomeScene sets has_entity_name False and names itself from the
      gateway's scene label.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done  # README "Troubleshooting"
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: done
    comment: >-
      Primary controls (lights, sockets, covers, thermostats, buttons) carry no
      category. The rocker status LED is an EntityCategory.CONFIG switch: it
      configures how the physical button looks rather than controlling the load,
      which is what the category is for. It stays fully controllable — a config
      entity is still actuable, it is only sorted out of the primary controls.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All exposed entities are useful by default; none are noisy.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      A revoked token is handled by the reauthentication flow rather than a
      repair issue. Losing the WebSocket, however, degrades the integration
      silently — states keep updating on the 60 s REST poll, so nothing looks
      broken, it just stops being live. After MAX_RECONNECT_FAILURES consecutive
      failed reconnects the coordinator raises a non-fixable warning issue
      (`websocket_push_failure`) and deletes it again on the next successful
      connect, since only the gateway or the network coming back resolves it.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
