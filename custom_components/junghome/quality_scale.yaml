rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >-
      Includes the async_show_progress branch (the waiting-for-app-approval
      screen), driven by a register mock blocked on an asyncio.Event — an
      immediately-resolving mock is already done() at the eager task's first
      check and silently skips that path.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done  # README "Removing the integration"
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: >-
      Every device-backed entity sets it. The scene platform is the one
      exception: scenes have no backing device to carry the label, so
      JungHomeScene sets has_entity_name False and names itself from the
      gateway's scene label.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      No custom service actions are registered, but the rule explicitly covers
      PLATFORM actions too (turning a light/switch on, moving a cover, setting a
      thermostat). Every one of those raises a translated HomeAssistantError:
      `cannot_send` when the WebSocket cannot carry the command, and
      `command_timeout` when the gateway never confirms it (see
      `_send_datapoint_command`); scene recall raises `scene_not_found`.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Bronze rules added after this file was first written
  docs-conditions:
    status: exempt
    comment: The integration provides no device conditions.
  docs-triggers:
    status: done
    comment: >-
      Device triggers (button pressed/released) are documented in the README's
      "Button automations" section and docs/example-button-automation.md.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: done
    comment: >-
      Entries are keyed on the gateway hardware serial (mDNS TXT record for
      discovered entries; REST config/parameter/system_serial for manual
      ones), so a discovery updates the stored host regardless of how the
      entry was added. Legacy host/hostname-keyed entries are migrated to the
      serial in place on rediscovery or reconfigure, with their identity
      anchor frozen first (see const.entry_anchor). Only an entry against
      firmware that exposes no serial anywhere stays host-keyed.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done  # README "Troubleshooting"
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: done
    comment: >-
      Primary controls (lights, sockets, covers, thermostats, buttons) carry no
      category. The rocker status LED is an EntityCategory.CONFIG switch: it
      configures how the physical button looks rather than controlling the load,
      which is what the category is for. It stays fully controllable — a config
      entity is still actuable, it is only sorted out of the primary controls.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All exposed entities are useful by default; none are noisy.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      A revoked token is handled by the reauthentication flow rather than a
      repair issue. Losing the WebSocket, however, degrades the integration
      silently — states keep updating on the REST poll, so nothing looks
      broken, it just stops being live. After MAX_RECONNECT_FAILURES consecutive
      failed reconnects the coordinator raises a non-fixable warning issue
      (`websocket_push_failure`) and deletes it again on the next connect that
      STAYS UP for STABLE_SESSION_SECONDS (a bare connect is not proof of
      recovery — a flapping socket would clear and re-raise the issue forever),
      and on unload. It is not user-fixable: only the gateway or the network
      coming back resolves it.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
